when:
  - event: push
    branch: main
  - event: manual
    branch: main

skip_clone: true

steps:
    notification:
        image: appleboy/drone-discord
        settings:
            webhook_id:
                from_secret: discord_webhook_id
            webhook_token: 
                from_secret: discord_webhook_token
            message: |
                **Build Details:**
                • **Status:** {{ build.status }}
                • **Execution:** #{{ build.number }}
                • **Triggered By:** {{ build.author }} ({{ build.event }})
                • **Branch:** `{{ build.branch }}`
                • **Commit:** [{{ build.commit }}]({{ build.link }})
                • **Message:** {{ build.message }}